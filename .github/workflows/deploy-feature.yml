# ============================================================
# deploy-feature.yml
# GitHub Actions CI/CD Pipeline - hello-world-api
#
# Triggers  : push to feature/** branches
# Stages    : checkout -> java setup -> build -> test -> deploy
#
# GitHub Secrets required:
#   ANYPOINT_CLIENT_ID      - Anypoint Connected App client ID
#   ANYPOINT_CLIENT_SECRET  - Anypoint Connected App client secret
#
# Dynamic app naming (sanitized for CloudHub 2.0):
#   feature/login           -> hello-world-api-feature-login
#   feature/my-feature/v2   -> hello-world-api-feature-my-feature-v2
# ============================================================

name: CI/CD - Feature Branch to CloudHub 2.0 Sandbox

on:
  push:
    branches:
      - "feature/**"
  # Manual trigger with option to skip deploy
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip deployment (build and test only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Cancel in-progress runs for the same branch on new push
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  MAVEN_OPTS: "-Xmx1024m -XX:MaxMetaspaceSize=512m"
  DEPLOY_ENVIRONMENT: "Sandbox"
  DEPLOY_TARGET: "Cloudhub-US-East-1"
  DEPLOY_REPLICA_SIZE: "0.1"
  DEPLOY_REPLICAS: "1"
  DEPLOY_RUNTIME_VERSION: "4.6.0:1e"

jobs:
  build-test-deploy:
    name: Build, Test & Deploy to Sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ----------------------------------------------------------
      # 1. Checkout source code
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # 2. Set up Java 17 with Maven cache
      # ----------------------------------------------------------
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"

      # ----------------------------------------------------------
      # 3. Additional Maven dependency cache layer
      # ----------------------------------------------------------
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: "${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}"
          restore-keys: |
            ${{ runner.os }}-maven-

      # ----------------------------------------------------------
      # 4. Build the Mule application (skip tests here)
      # ----------------------------------------------------------
      - name: Build Mule application
        run: |
          mvn clean package \
            --batch-mode \
            --no-transfer-progress \
            -DskipTests \
            -s settings.xml
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

      # ----------------------------------------------------------
      # 5. Run MUnit tests and generate coverage report
      # ----------------------------------------------------------
      - name: Run MUnit tests
        run: |
          mvn test \
            --batch-mode \
            --no-transfer-progress \
            -s settings.xml
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

      # ----------------------------------------------------------
      # 6. Publish MUnit coverage report as a pipeline artifact
      # ----------------------------------------------------------
      - name: Upload MUnit coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munit-coverage-report
          path: target/site/munit/coverage/
          retention-days: 14

      # ----------------------------------------------------------
      # 7. Compute a sanitized, CloudHub-safe application name
      #    from the current branch name.
      #
      #    Transformations applied (in order):
      #      a) lowercase everything
      #      b) replace '/' and '_' with '-'
      #      c) strip characters that are not [a-z0-9-]
      #      d) collapse consecutive '-' into a single '-'
      #      e) strip leading/trailing '-'
      #      f) prefix with 'hello-world-api-'
      #      g) truncate total length to 42 characters
      #         (CloudHub 2.0 app name limit)
      # ----------------------------------------------------------
      - name: Compute CloudHub application name
        id: app-name
        run: |
          RAW_BRANCH="${{ github.ref_name }}"

          # a) Lowercase
          BRANCH_LOWER=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]')

          # b) Replace '/' and '_' with '-'
          BRANCH_DASHES=$(echo "$BRANCH_LOWER" | tr '/_' '-')

          # c) Strip non-alphanumeric, non-hyphen characters
          BRANCH_CLEAN=$(echo "$BRANCH_DASHES" | sed 's/[^a-z0-9-]//g')

          # d) Collapse multiple consecutive hyphens
          BRANCH_NO_MULTI=$(echo "$BRANCH_CLEAN" | sed 's/--*/-/g')

          # e) Strip leading and trailing hyphens
          BRANCH_TRIMMED=$(echo "$BRANCH_NO_MULTI" | sed 's/^-//;s/-$//')

          # f) Prepend artifact prefix
          FULL_NAME="hello-world-api-${BRANCH_TRIMMED}"

          # g) Truncate to 42 characters
          APP_NAME=$(echo "$FULL_NAME" | cut -c1-42)

          # Strip trailing hyphen that might result from truncation
          APP_NAME=$(echo "$APP_NAME" | sed 's/-$//')

          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "Computed CloudHub app name: ${APP_NAME}"

      # ----------------------------------------------------------
      # 8. Deploy to CloudHub 2.0 Sandbox
      #
      #    Skip conditions:
      #      - Pull Request event  (github.event_name == 'pull_request')
      #      - Manual trigger with skip_deploy = "true"
      #
      #    The Mule Maven Plugin cloudhub2Deployment configuration
      #    in pom.xml is used; we override app.name and credentials
      #    via -D properties at runtime.
      # ----------------------------------------------------------
      - name: Deploy to CloudHub 2.0 Sandbox
        if: |
          github.event_name != 'pull_request' &&
          github.event.inputs.skip_deploy != 'true'
        run: |
          echo "Deploying application: ${{ steps.app-name.outputs.app_name }}"
          echo "Target environment: ${{ env.DEPLOY_ENVIRONMENT }}"
          echo "CloudHub target: ${{ env.DEPLOY_TARGET }}"

          mvn deploy \
            --batch-mode \
            --no-transfer-progress \
            -DskipTests \
            -s settings.xml \
            -Dapp.name="${{ steps.app-name.outputs.app_name }}" \
            -Ddeploy.environment="${{ env.DEPLOY_ENVIRONMENT }}" \
            -Ddeploy.target="${{ env.DEPLOY_TARGET }}" \
            -Ddeploy.replica.size="${{ env.DEPLOY_REPLICA_SIZE }}" \
            -Ddeploy.replicas="${{ env.DEPLOY_REPLICAS }}" \
            -Ddeploy.runtime.version="${{ env.DEPLOY_RUNTIME_VERSION }}" \
            -Danypoint.client.id="${{ secrets.ANYPOINT_CLIENT_ID }}" \
            -Danypoint.client.secret="${{ secrets.ANYPOINT_CLIENT_SECRET }}"
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

      # ----------------------------------------------------------
      # 9. Print deployment summary
      # ----------------------------------------------------------
      - name: Deployment summary
        if: |
          github.event_name != 'pull_request' &&
          github.event.inputs.skip_deploy != 'true'
        run: |
          echo "=========================================="
          echo "Deployment Complete"
          echo "App Name  : ${{ steps.app-name.outputs.app_name }}"
          echo "Branch    : ${{ github.ref_name }}"
          echo "Environment: ${{ env.DEPLOY_ENVIRONMENT }}"
          echo "Target    : ${{ env.DEPLOY_TARGET }}"
          echo "Commit    : ${{ github.sha }}"
          echo "=========================================="