# =============================================================================
# GitHub Actions CI/CD Pipeline – hello-world-api
# Trigger  : push to any feature/* branch (direct push only, not PRs)
# Jobs     : build → test → deploy to CloudHub 2.0 Sandbox
#
# Required GitHub Secrets:
#   ANYPOINT_CLIENT_ID     – Connected App client ID (Anypoint Platform)
#   ANYPOINT_CLIENT_SECRET – Connected App client secret
# =============================================================================

name: Deploy Feature Branch to CloudHub 2.0 Sandbox

on:
  push:
    branches:
      - "feature/**"   # Matches feature/login, feature/my-feature, etc.

  # Do NOT trigger on pull_request events – deployment is for direct pushes only.

env:
  JAVA_VERSION: "17"
  MULE_RUNTIME_VERSION: "4.6.0:1e"
  DEPLOY_ENVIRONMENT: "Sandbox"
  DEPLOY_TARGET: "Cloudhub-US-East-1"
  DEPLOY_REPLICA_SIZE: "0.1"
  DEPLOY_REPLICAS: "1"
  MULE_ENV: "sandbox"

jobs:

  # ---------------------------------------------------------------------------
  # Job 1 – build-and-test
  # Compiles the Mule application and executes all MUnit tests.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and Run MUnit Tests
    runs-on: ubuntu-latest

    steps:

      # 1. Check out the repository at the pushed commit.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (required by Mule 4.6+).
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      # 3. Cache the Maven local repository to speed up subsequent runs.
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Configure the Maven settings.xml with Anypoint Exchange credentials
      #    so that Mule connectors and plugins can be downloaded.
      - name: Configure Maven settings for Anypoint Exchange
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          servers: >
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              },
              {
                "id": "mulesoft-releases",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              }
            ]

      # 5. Compile and run MUnit tests.  The -DmuleEnv flag tells the app which
      #    config file to load; tests run against the local profile.
      - name: Build and run MUnit tests
        run: |
          mvn clean test \
            -DmuleEnv=local \
            -Dmule.env=local \
            -B \
            --no-transfer-progress

      # 6. Upload MUnit coverage reports as a build artefact.
      - name: Upload MUnit coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munit-coverage-report
          path: target/site/munit/coverage/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job 2 – deploy
  # Packages the Mule application and deploys it to CloudHub 2.0 Sandbox.
  # Runs only on direct pushes (not pull requests) after build-and-test passes.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to CloudHub 2.0 Sandbox
    runs-on: ubuntu-latest
    needs: build-and-test

    # Skip deployment when the workflow was triggered by a pull_request event.
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configure Maven settings for Anypoint Exchange
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          servers: >
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              },
              {
                "id": "mulesoft-releases",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              }
            ]

      # Derive a CloudHub-safe application name from the branch name.
      # Branch  : feature/my-feature-login
      # App name: hello-world-api-feature-my-feature-login
      # Rules   : lowercase, replace / and _ and spaces with -, max 42 chars.
      - name: Derive sanitised application name from branch
        id: app-name
        run: |
          RAW_BRANCH="${{ github.ref_name }}"
          # Lowercase and replace non-alphanumeric chars (except hyphen) with hyphens
          SANITISED=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          APP_NAME="hello-world-api-${SANITISED}"
          # CloudHub application names must be <= 42 characters
          APP_NAME="${APP_NAME:0:42}"
          # Strip trailing hyphens that may appear after truncation
          APP_NAME=$(echo "$APP_NAME" | sed 's/-$//')
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "Deploying as: ${APP_NAME}"

      # Package (skip tests – already executed in job 1) and deploy via the
      # Mule Maven Plugin cloudhub2Deploy goal.
      - name: Package and deploy to CloudHub 2.0 Sandbox
        run: |
          mvn deploy \
            -DskipTests \
            -Dapp.name=${{ steps.app-name.outputs.app_name }} \
            -Ddeploy.environment=${{ env.DEPLOY_ENVIRONMENT }} \
            -Ddeploy.runtime.version=${{ env.MULE_RUNTIME_VERSION }} \
            -Ddeploy.replica.size=${{ env.DEPLOY_REPLICA_SIZE }} \
            -Ddeploy.replicas=${{ env.DEPLOY_REPLICAS }} \
            -Dmule.env=${{ env.MULE_ENV }} \
            -Danypoint.client.id=${{ secrets.ANYPOINT_CLIENT_ID }} \
            -Danypoint.client.secret=${{ secrets.ANYPOINT_CLIENT_SECRET }} \
            -B \
            --no-transfer-progress

      # Post a deployment summary to the GitHub Actions job summary page.
      - name: Write deployment summary
        if: success()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property       | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **App Name**   | \`${{ steps.app-name.outputs.app_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment**| \`${{ env.DEPLOY_ENVIRONMENT }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target**     | \`${{ env.DEPLOY_TARGET }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Runtime**    | \`${{ env.MULE_RUNTIME_VERSION }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch**     | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit**     | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"