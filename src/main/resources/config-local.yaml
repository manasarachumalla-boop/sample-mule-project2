# ============================================================
# config-local.yaml
# Environment configuration for LOCAL development
# Loaded when: -Dmule.env=local (default)
# ============================================================

# HTTP Listener settings
http:
  port: "8081"
  basePath: "/api"

# Application info
app:
  name: "hello-world-api"
  env: "local"
  version: "1.0.0"

# Logging level for local development (verbose)
log:
  level: "DEBUG"

# API message (customizable per environment)
api:
  greeting: "Hello World from MuleSoft"