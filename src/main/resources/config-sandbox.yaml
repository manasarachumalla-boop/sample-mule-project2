# =============================================================================
# Sandbox Environment Configuration
# Used when mule.env=sandbox (set automatically by the CI/CD pipeline)
# Sensitive values (credentials, secrets) must be stored in
# Anypoint Runtime Manager secure properties, NOT in this file.
# =============================================================================

http:
  listener:
    host: "0.0.0.0"
    port: "8081"

api:
  name: "hello-world-api"
  version: "v1"
  basePath: "/hello"

logging:
  level: "INFO"
  appName: "hello-world-api"