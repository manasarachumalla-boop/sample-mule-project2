# ============================================================
# config-sandbox.yaml
# Environment configuration for SANDBOX (CloudHub 2.0)
# Loaded when: -Dmule.env=sandbox
# ============================================================

# HTTP Listener settings
# On CloudHub 2.0, port 8081 is the standard internal port
http:
  port: "8081"
  basePath: "/api"

# Application info
app:
  name: "hello-world-api"
  env: "sandbox"
  version: "1.0.0"

# Logging level for sandbox (informational)
log:
  level: "INFO"

# API message (customizable per environment)
api:
  greeting: "Hello World from MuleSoft"